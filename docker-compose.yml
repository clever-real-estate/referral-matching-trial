services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: referral_trial
      POSTGRES_USER: referral
      POSTGRES_PASSWORD: referral
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U referral -d referral_trial"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  pgdata:
